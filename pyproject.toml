[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glm-lala"
version = "0.1.0"
description = "Native EXL3 serving launchers for GLM-5.3-Flash-lala"
requires-python = ">=3.11"
dependencies = ["huggingface-hub>=0.36,<2"]

[project.scripts]
glm-lala = "glm_lala.cli:main"

[tool.setuptools.packages.find]
include = ["glm_lala*"]

[tool.setuptools.package-data]
glm_lala = ["runtime-lock.json"]
